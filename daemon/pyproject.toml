[project]
name = "pioneertv"
version = "0.1.0"
description = "Pioneer TV daemon: gamepad to virtual input, HDMI-CEC and a bridge to the Chromium shell"
requires-python = ">=3.11"
dependencies = ["evdev>=1.6", "aiohttp>=3.8"]

[project.scripts]
pioneertv = "pioneertv.main:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pioneertv*"]
