# Pioneer TV Weston configuration. Installed to /home/pi/.config/weston.ini.
[core]
shell=kiosk-shell.so
idle-time=0
require-input=false

[output]
name=HDMI-A-1
# 720p on purpose: players cap stream quality to the window size, and the
# Pi 3 cannot decode 1080p in a browser. Change to 1920x1080@60 on a Pi 4+.
mode=1280x720@60

[autolaunch]
path=/opt/pioneer-tv/system/start-chromium.sh
# Weston exits when Chromium exits; systemd restarts both for a clean state.
watch=true

[libinput]
enable-tap=true

[keyboard]
keymap_layout=se
