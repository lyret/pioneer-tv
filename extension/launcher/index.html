<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pioneer TV</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../content/paper.css">
  <link rel="stylesheet" href="../content/content.css">
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div class="hearth" id="hearth" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
    <div class="embers" id="embers"></div>
  </div>
  <div class="page">
    <header class="masthead">
      <div class="masthead-left">
        <span class="dateline" id="dateline">…</span>
      </div>
      <div class="masthead-right">
        <span class="pill" id="pill-wifi" title="Nätverk"></span>
        <span class="pill" id="pill-tailscale" title="Tailscale"></span>
        <span class="pill" id="pill-gamepad" title="Handkontroll"></span>
        <span class="pill" id="pill-daemon" title="Daemon"></span>
        <span class="clock" id="clock">--:--</span>
      </div>
    </header>
    <div class="rule"></div>

    <main class="content">
      <section class="hero">
        <h1 class="greeting">Vad vill du se?</h1>
      </section>

      <section class="tiles" id="tiles" aria-label="Tjänster"></section>

      <section class="row">
        <form class="search pioneertv-card" id="search-form" role="search">
          <span class="search-icon" id="search-icon"></span>
          <input id="search" type="search" placeholder="Sök film eller serie…" autocomplete="off" data-pioneertv-initial>
        </form>
        <button class="small-tile pioneertv-card" id="btn-menu" type="button">
          <span class="small-icon" data-icon="menu"></span><span>Meny</span>
        </button>
        <button class="small-tile pioneertv-card" id="btn-tv" type="button">
          <span class="small-icon" data-icon="power"></span><span>TV av</span>
        </button>
      </section>

      <section class="search-targets" id="search-targets" hidden>
        <p class="targets-title">Sök efter <em id="targets-query"></em> på</p>
        <div class="targets" id="targets"></div>
      </section>
    </main>

    <footer class="legend">
      <span><i data-icon="arrowLeft"></i><i data-icon="arrowRight"></i><i data-icon="arrowUp"></i><i data-icon="arrowDown"></i> navigera</span>
      <span><kbd class="pioneertv-kbd">A</kbd> välj</span>
      <span><kbd class="pioneertv-kbd">B</kbd> tillbaka</span>
      <span><kbd class="pioneertv-kbd">Y</kbd> tangentbord</span>
      <span><kbd class="pioneertv-kbd">START</kbd> meny</span>
      <span><kbd class="pioneertv-kbd">GUIDE</kbd> hem</span>
      <span class="credit">Maskinrepubliken</span>
    </footer>
  </div>

  <script src="default-services.js"></script>
  <script src="art.js"></script>
  <script src="../content/pixel-icons.js"></script>
  <script src="../content/bridge.js"></script>
  <script src="../content/spatial-nav.js"></script>
  <script src="../content/keyboard.js"></script>
  <script src="../content/hud.js"></script>
  <script src="../content/main.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
