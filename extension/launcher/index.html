<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic TV</title>
  <link rel="stylesheet" href="../content/content.css">
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Magic TV</span>
      </div>
      <div class="status">
        <span class="pill" id="pill-gamepad" title="Handkontroll">🎮</span>
        <span class="pill" id="pill-daemon" title="Daemon">●</span>
        <span class="clock" id="clock">--:--</span>
      </div>
    </header>

    <main class="content">
      <section class="hero">
        <h1 class="greeting" id="greeting">God kväll</h1>
        <p class="subtitle">Vad vill du se?</p>
      </section>

      <section class="tiles" id="tiles" aria-label="Tjänster"></section>

      <section class="row">
        <form class="search" id="search-form" role="search">
          <span class="search-icon">⌕</span>
          <input id="search" type="search" placeholder="Sök film eller serie…" autocomplete="off" data-magictv-initial>
        </form>
        <button class="small-tile" id="btn-menu" type="button">
          <span class="small-icon">☰</span><span>Meny</span>
        </button>
        <button class="small-tile" id="btn-tv" type="button">
          <span class="small-icon">⏻</span><span>TV av</span>
        </button>
      </section>

      <section class="search-targets" id="search-targets" hidden>
        <p class="targets-title">Sök efter <strong id="targets-query"></strong> på</p>
        <div class="targets" id="targets"></div>
      </section>
    </main>

    <footer class="hint">
      <span><b>◀ ▶ ▲ ▼</b> navigera</span>
      <span><b>A</b> välj</span>
      <span><b>B</b> tillbaka</span>
      <span><b>Y</b> tangentbord</span>
      <span><b>Start</b> meny</span>
      <span><b>Guide</b> hem</span>
    </footer>
  </div>

  <script src="default-services.js"></script>
  <script src="../content/bridge.js"></script>
  <script src="../content/spatial-nav.js"></script>
  <script src="../content/keyboard.js"></script>
  <script src="../content/hud.js"></script>
  <script src="../content/main.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
